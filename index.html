<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sync - Cyberpunk Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: rgba(10, 10, 18, 0.85);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --text-main: #e0e0ff;
        }

        body {
            background-color: transparent;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3, .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }

        /* Neon Glows */
        .glow-text-cyan {
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            color: #fff;
        }
        .glow-text-pink {
            text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            color: #fff;
        }

        .neon-box {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .neon-box:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .neon-box-pink {
            border: 1px solid rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.1), inset 0 0 20px rgba(255, 0, 255, 0.05);
        }

        /* Calendar Grid */
        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10%;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-cell:hover:not(.empty) {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .day-cell.active {
            background: rgba(255, 0, 255, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), inset 0 0 10px var(--neon-pink);
            color: #fff;
            transform: scale(1.05);
            z-index: 10;
        }

        .day-cell.empty {
            cursor: default;
            opacity: 0.3;
            background: transparent;
            border-color: transparent;
        }

        .day-cell .day-number {
            font-size: 1.2rem;
            font-weight: 600;
            pointer-events: none;
        }

        .event-indicator {
            display: flex;
            gap: 4px;
            margin-top: auto;
            margin-bottom: 10%;
            pointer-events: none;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-apt { background: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }
        .dot-todo { background: var(--neon-pink); box-shadow: 0 0 5px var(--neon-pink); }
        .dot-event { background: var(--neon-green); box-shadow: 0 0 5px var(--neon-green); }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-in {
            animation: slideIn 0.4s ease forwards;
        }

        /* Inputs & Buttons */
        .neon-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #fff;
            border-radius: 6px;
            padding: 8px 12px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        .neon-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .neon-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .neon-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Checkbox styling */
        .todo-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--neon-pink);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .todo-checkbox:checked {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .todo-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .todo-item.done span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Glassmorphism List Items */
        .list-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .list-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .list-item.apt { border-left-color: var(--neon-cyan); }
        .list-item.todo { border-left-color: var(--neon-pink); }
        .list-item.event { border-left-color: var(--neon-green); }

        /* Term Badges */
        .term-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 0.55rem;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }
        .term-badge.t-inset {
            background: rgba(255, 255, 0, 0.15);
            color: #ffff00;
            border: 1px solid rgba(255, 255, 0, 0.5);
        }
        .term-badge.t-hol {
            background: rgba(57, 255, 20, 0.15);
            color: var(--neon-green);
            border: 1px solid rgba(57, 255, 20, 0.5);
        }

        #snakeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">
    
    <canvas id="snakeCanvas"></canvas>

    <header class="w-full max-w-7xl flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="filter: drop-shadow(0 0 8px #00f3ff);">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <h1 class="text-3xl md:text-5xl font-black tracking-wider glow-text-cyan uppercase">Neon Sync</h1>
            
            <div class="ml-2 md:ml-6 px-4 py-1.5 border-2 rounded-lg bg-black/60 backdrop-blur-sm transform -skew-x-12 transition-all hover:scale-105 cursor-default"
                 style="border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(188, 19, 254, 0.4), inset 0 0 8px rgba(188, 19, 254, 0.2);">
                <span class="orbitron font-black text-lg md:text-xl tracking-widest block transform skew-x-12" 
                      style="color: #fff; text-shadow: 0 0 5px var(--neon-purple), 0 0 10px var(--neon-purple);">
                    normz<span class="text-purple-400">FPV</span>
                </span>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="changeMonth(-1)" class="neon-btn">&lt; Prev</button>
            <h2 id="monthYearDisplay" class="text-xl md:text-3xl font-bold w-48 text-center text-white orbitron tracking-widest">NOV 2026</h2>
            <button onclick="changeMonth(1)" class="neon-btn">Next &gt;</button>
        </div>
    </header>

    <main class="w-full max-w-7xl flex flex-col lg:flex-row gap-8 items-start">
        
        <div class="w-full lg:w-2/3 flex flex-col gap-8 flex-shrink-0">
            <section class="neon-box p-6 w-full">
                <div class="grid grid-cols-7 gap-2 md:gap-4 mb-4 text-center orbitron text-cyan-400 font-bold text-sm md:text-base">
                    <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2 md:gap-4"></div>
                <div class="flex flex-wrap justify-center gap-4 mt-6 text-[10px] md:text-xs orbitron text-gray-400 border-t border-cyan-500/20 pt-4">
                    <span class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-[rgba(57,255,20,0.15)] border border-[rgba(57,255,20,0.5)] flex items-center justify-center text-[8px] text-green-400">H</span> Holiday</span>
                    <span class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-[rgba(255,255,0,0.15)] border border-[rgba(255,255,0,0.5)] flex items-center justify-center text-[8px] text-yellow-400">I</span> Inset Day</span>
                </div>
            </section>

            <section class="neon-box p-6 w-full" style="border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(188, 19, 254, 0.1), inset 0 0 20px rgba(188, 19, 254, 0.05);">
                <div class="flex flex-col md:flex-row justify-between items-center mb-4 border-b border-purple-500/30 pb-3 gap-2">
                    <div class="flex items-center gap-2">
                        <h3 class="text-xl font-bold uppercase tracking-wide orbitron" style="color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple);">Work Shifts</h3>
                        <select id="shiftMonthSelect" onchange="changeShiftMonth()" class="bg-black/50 border border-purple-500/50 text-purple-400 text-xs rounded px-2 py-1 outline-none orbitron focus:border-purple-400 cursor-pointer">
                            <option value="0">JAN</option><option value="1">FEB</option><option value="2">MAR</option><option value="3">APR</option>
                            <option value="4">MAY</option><option value="5">JUN</option><option value="6">JUL</option><option value="7">AUG</option>
                            <option value="8">SEP</option><option value="9">OCT</option><option value="10">NOV</option><option value="11">DEC</option>
                        </select>
                        <select id="shiftYearSelect" onchange="changeShiftMonth()" class="bg-black/50 border border-purple-500/50 text-purple-400 text-xs rounded px-2 py-1 outline-none orbitron focus:border-purple-400 cursor-pointer">
                            <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
                        </select>
                    </div>
                    <div class="flex flex-wrap justify-center gap-3 text-[10px] md:text-xs orbitron">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_5px_#00f3ff]"></span> LD</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-pink-400 shadow-[0_0_5px_#ff00ff]"></span> LTL</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#39ff14]"></span> E</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400 shadow-[0_0_5px_#ffff00]"></span> L</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_5px_#ff9900]"></span> OC</span>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 md:gap-3 text-center orbitron text-purple-400 font-bold text-xs md:text-sm mb-2">
                    <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div>
                </div>
                <div id="shiftsGrid" class="grid grid-cols-7 gap-2 md:gap-3 text-center orbitron text-sm"></div>
                <p class="text-[10px] text-gray-500 mt-3 text-center italic">* Click the + or edit icon to assign a shift.</p>
            </section>
        </div>

        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            <section id="eventPanel" class="neon-box neon-box-pink p-6 flex flex-col gap-6 slide-in">
                <div class="flex justify-between items-center border-b border-fuchsia-500/30 pb-4">
                    <h3 class="text-2xl font-bold glow-text-pink uppercase tracking-wide" id="selectedDateDisplay">Upcoming Events</h3>
                    <button id="closePanelBtn" onclick="closePanel()" class="text-pink-500 hover:text-white transition-colors text-xl font-bold px-2" style="display: none;">✕</button>
                </div>

            <div id="addEventSection" class="flex flex-col gap-3 w-full" style="display: none;">
                <button id="showAddFormBtn" onclick="toggleAddForm(true)" class="neon-btn w-full py-2 border-dashed border-gray-500 text-gray-400 hover:text-white hover:border-pink-500 transition-all">+ Add</button>
                
                <div id="addEventForm" class="flex-col gap-3 bg-black/40 p-4 rounded-lg border border-white/5 relative" style="display: none;">
                    <button onclick="toggleAddForm(false)" class="absolute top-2 right-2 text-gray-500 hover:text-white text-sm">✕</button>
                    <div class="flex gap-2 mt-4">
                        <button id="btnAptSelect" onclick="setEventType('apt')" class="flex-1 py-2 text-sm orbitron border border-cyan-400 text-cyan-400 rounded transition-all bg-cyan-400/20 shadow-[0_0_10px_rgba(0,243,255,0.3)]">Appt</button>
                        <button id="btnTodoSelect" onclick="setEventType('todo')" class="flex-1 py-2 text-sm orbitron border border-gray-600 text-gray-400 rounded transition-all hover:border-pink-500 hover:text-pink-500">To-Do</button>
                        <button id="btnEventSelect" onclick="setEventType('event')" class="flex-1 py-2 text-sm orbitron border border-gray-600 text-gray-400 rounded transition-all hover:border-green-400 hover:text-green-400">Event</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="time" id="eventTimeInput" class="neon-input w-24 text-sm" style="color-scheme: dark;">
                        <input type="text" id="eventInput" class="neon-input flex-1" placeholder="Enter details..." onkeypress="handleEnter(event)">
                        <button onclick="addEvent()" class="neon-btn font-bold text-lg px-4">+</button>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto pr-2 flex flex-col gap-4 max-h-[500px]">
                <div>
                    <h4 class="orbitron text-cyan-400 text-sm mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_5px_#00f3ff]"></span>Appointments
                    </h4>
                    <div id="aptList" class="flex flex-col gap-2"></div>
                </div>
                <div>
                    <h4 class="orbitron text-pink-400 text-sm mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-pink-400 shadow-[0_0_5px_#ff00ff]"></span>To-Do List
                    </h4>
                    <div id="todoList" class="flex flex-col gap-2"></div>
                </div>
                <div>
                    <h4 class="orbitron text-green-400 text-sm mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#39ff14]"></span>Events
                    </h4>
                    <div id="eventList" class="flex flex-col gap-2"></div>
                </div>
                <div id="emptyState" class="text-center text-gray-500 py-8 italic hidden">No signals detected for this cycle.</div>
            </div>
        </section>

            <div class="relative pt-8 slide-in w-full">
                <div class="absolute top-0 left-0 bg-[var(--panel-bg)] border px-6 py-2 rounded-t-xl z-10 backdrop-blur-md flex items-center justify-center"
                     style="border-color: var(--neon-purple); border-bottom-color: var(--panel-bg); border-bottom-width: 2px; box-shadow: 0 -8px 15px -3px rgba(188,19,254,0.3), inset 0 5px 10px -3px rgba(188,19,254,0.2); padding-bottom: 10px; transform: translateY(1px);">
                    <h3 class="text-lg font-bold uppercase tracking-wide orbitron" style="text-shadow: 0 0 8px var(--neon-purple), 0 0 20px var(--neon-purple); color: #fff;">Quick Add</h3>
                </div>
                
                <section id="quickAddPanel" class="neon-box p-6 pt-6 flex flex-col gap-4 relative z-0 rounded-tl-none" 
                         style="border-color: var(--neon-purple); box-shadow: 0 5px 15px rgba(188, 19, 254, 0.1), inset 0 0 20px rgba(188, 19, 254, 0.05);">
                    <div class="flex flex-col gap-3 bg-black/40 p-4 rounded-lg border border-white/5">
                        <div class="flex gap-2">
                            <input type="date" id="qaDate" class="neon-input flex-1 text-sm" style="color-scheme: dark;">
                            <input type="time" id="qaTime" class="neon-input w-24 text-sm" style="color-scheme: dark;">
                        </div>
                        <input type="text" id="qaText" class="neon-input text-sm" placeholder="Signal details...">
                        <div class="flex gap-2 mt-1">
                            <button onclick="quickAdd('apt')" class="flex-1 py-2 text-sm orbitron border border-cyan-400 text-cyan-400 rounded transition-all hover:bg-cyan-400 hover:text-black shadow-[0_0_5px_rgba(0,243,255,0.3)]">+ Appt</button>
                            <button onclick="quickAdd('todo')" class="flex-1 py-2 text-sm orbitron border border-pink-500 text-pink-500 rounded transition-all hover:bg-pink-500 hover:text-black shadow-[0_0_5px_rgba(255,0,255,0.3)]">+ To-Do</button>
                            <button onclick="quickAdd('event')" class="flex-1 py-2 text-sm orbitron border border-green-400 text-green-400 rounded transition-all hover:bg-green-400 hover:text-black shadow-[0_0_5px_rgba(57,255,20,0.3)]">+ Event</button>
                        </div>
                    </div>
                </section>
            </div>
        </div>

    </main>

    <script>
        let currentDate = new Date(2026, 10, 3);
        let shiftCurrentDate = new Date(2026, 10, 3);
        let selectedDateStr = null;
        let currentEventType = 'apt';

        const halfTermHolidays = [
            { start: '2026-10-26', end: '2026-10-30' },
            { start: '2026-12-21', end: '2027-01-01' },
            { start: '2027-02-15', end: '2027-02-19' },
            { start: '2027-03-26', end: '2027-04-09' },
            { start: '2027-05-31', end: '2027-06-04' }
        ];

        const insetDays = ['2026-09-01', '2026-09-02', '2026-11-13', '2027-01-04', '2027-06-28'];

        // --- LOAD FROM LOCAL STORAGE (Fix for saving data) ---
        let eventsData = JSON.parse(localStorage.getItem('neonEventsData')) || {};
        let shiftsData = JSON.parse(localStorage.getItem('neonShiftsData')) || {};
        let onCallData = JSON.parse(localStorage.getItem('neonOnCallData')) || {};

        function saveData() {
            localStorage.setItem('neonEventsData', JSON.stringify(eventsData));
            localStorage.setItem('neonShiftsData', JSON.stringify(shiftsData));
            localStorage.setItem('neonOnCallData', JSON.stringify(onCallData));
        }
        // -----------------------------------------------------

        const calendarGrid = document.getElementById('calendarGrid');
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const eventPanel = document.getElementById('eventPanel');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const aptList = document.getElementById('aptList');
        const todoList = document.getElementById('todoList');
        const eventList = document.getElementById('eventList');
        const eventInput = document.getElementById('eventInput');
        const emptyState = document.getElementById('emptyState');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const addEventSection = document.getElementById('addEventSection');
        const addEventForm = document.getElementById('addEventForm');
        const showAddFormBtn = document.getElementById('showAddFormBtn');
        const btnAptSelect = document.getElementById('btnAptSelect');
        const btnTodoSelect = document.getElementById('btnTodoSelect');
        const btnEventSelect = document.getElementById('btnEventSelect');

        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        function init() {
            renderCalendar();
            renderEvents();
            renderShifts();
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYearDisplay.innerText = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const emptyDays = firstDay === 0 ? 6 : firstDay - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let i = 0; i < emptyDays; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                calendarGrid.appendChild(emptyCell);
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                cell.className = `day-cell ${dateStr === selectedDateStr ? 'active' : ''}`;
                cell.onclick = () => selectDate(dateStr);
                
                const span = document.createElement('span');
                span.className = 'day-number orbitron';
                span.innerText = day;
                cell.appendChild(span);

                let schoolLabel = '';
                let schoolClass = '';
                
                const currentDateObj = new Date(year, month, day);
                const dayOfWeek = currentDateObj.getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

                if (!isWeekend) {
                    if (insetDays.includes(dateStr)) {
                        schoolLabel = 'INSET';
                        schoolClass = 't-inset';
                    } else {
                        let isHol = false;
                        for (let range of halfTermHolidays) {
                            if (dateStr >= range.start && dateStr <= range.end) {
                                isHol = true; break;
                            }
                        }
                        if (isHol) {
                            schoolLabel = 'HOL';
                            schoolClass = 't-hol';
                        }
                    }
                }

                if (schoolLabel) {
                    const badge = document.createElement('div');
                    badge.className = `term-badge ${schoolClass}`;
                    badge.innerText = window.innerWidth < 768 ? schoolLabel.charAt(0) : schoolLabel;
                    cell.appendChild(badge);
                }
                
                const dayEvents = eventsData[dateStr] || [];
                if (dayEvents.length > 0) {
                    const indicatorDiv = document.createElement('div');
                    indicatorDiv.className = 'event-indicator';
                    
                    if (dayEvents.some(e => e.type === 'apt')) {
                        const dot = document.createElement('div');
                        dot.className = 'dot dot-apt';
                        indicatorDiv.appendChild(dot);
                    }
                    if (dayEvents.some(e => e.type === 'todo')) {
                        const dot = document.createElement('div');
                        dot.className = 'dot dot-todo';
                        indicatorDiv.appendChild(dot);
                    }
                    if (dayEvents.some(e => e.type === 'event')) {
                        const dot = document.createElement('div');
                        dot.className = 'dot dot-event';
                        indicatorDiv.appendChild(dot);
                    }
                    cell.appendChild(indicatorDiv);
                }
                
                calendarGrid.appendChild(cell);
            }
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
            
            eventPanel.classList.remove('slide-in');
            void eventPanel.offsetWidth;
            eventPanel.classList.add('slide-in');
            
            renderEvents();
        }

        function closePanel() {
            selectedDateStr = null;
            renderCalendar();
            
            eventPanel.classList.remove('slide-in');
            void eventPanel.offsetWidth;
            eventPanel.classList.add('slide-in');
            
            renderEvents();
        }

        function toggleAddForm(show) {
            if (show) {
                showAddFormBtn.style.display = 'none';
                addEventForm.style.display = 'flex';
                eventInput.focus();
            } else {
                showAddFormBtn.style.display = 'block';
                addEventForm.style.display = 'none';
            }
        }

        function setEventType(type) {
            currentEventType = type;
            
            btnAptSelect.className = 'flex-1 py-2 text-sm orbitron border border-gray-600 text-gray-400 rounded transition-all hover:border-cyan-400 hover:text-cyan-400';
            btnTodoSelect.className = 'flex-1 py-2 text-sm orbitron border border-gray-600 text-gray-400 rounded transition-all hover:border-pink-500 hover:text-pink-500';
            btnEventSelect.className = 'flex-1 py-2 text-sm orbitron border border-gray-600 text-gray-400 rounded transition-all hover:border-green-400 hover:text-green-400';

            if (type === 'apt') {
                btnAptSelect.className = 'flex-1 py-2 text-sm orbitron border border-cyan-400 text-cyan-400 rounded transition-all bg-cyan-400/20 shadow-[0_0_10px_rgba(0,243,255,0.3)]';
            } else if (type === 'todo') {
                btnTodoSelect.className = 'flex-1 py-2 text-sm orbitron border border-pink-500 text-pink-500 rounded transition-all bg-pink-500/20 shadow-[0_0_10px_rgba(255,0,255,0.3)]';
            } else {
                btnEventSelect.className = 'flex-1 py-2 text-sm orbitron border border-green-400 text-green-400 rounded transition-all bg-green-400/20 shadow-[0_0_10px_rgba(57,255,20,0.3)]';
            }
            eventInput.focus();
        }

        function getTodayStr() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        function renderEvents() {
            aptList.innerHTML = '';
            todoList.innerHTML = '';
            eventList.innerHTML = '';
            
            let eventsToRender = [];
            let isSpecificDate = !!selectedDateStr;

            if (isSpecificDate) {
                addEventSection.style.display = 'flex';
                toggleAddForm(false);
                closePanelBtn.style.display = 'block';
                
                const parts = selectedDateStr.split('-');
                const dateObj = new Date(parts[0], parseInt(parts[1])-1, parts[2]);
                selectedDateDisplay.innerText = `${monthNames[dateObj.getMonth()]} ${parts[2]}, ${parts[0]}`;
                
                eventsToRender = eventsData[selectedDateStr] || [];
            } else {
                addEventSection.style.display = 'none';
                closePanelBtn.style.display = 'none';
                selectedDateDisplay.innerText = 'Upcoming Events';
                
                const todayStr = getTodayStr();
                Object.keys(eventsData).sort().forEach(date => {
                    if (date >= todayStr) {
                        eventsData[date].forEach(event => {
                            eventsToRender.push({ ...event, date });
                        });
                    }
                });
            }
            
            const apts = eventsToRender.filter(e => e.type === 'apt');
            const todos = eventsToRender.filter(e => e.type === 'todo');
            const events = eventsToRender.filter(e => e.type === 'event');
            
            if (apts.length === 0 && todos.length === 0 && events.length === 0) {
                emptyState.style.display = 'block';
                aptList.parentElement.style.display = 'none';
                todoList.parentElement.style.display = 'none';
                eventList.parentElement.style.display = 'none';
                return;
            } else {
                emptyState.style.display = 'none';
                aptList.parentElement.style.display = apts.length ? 'block' : 'none';
                todoList.parentElement.style.display = todos.length ? 'block' : 'none';
                eventList.parentElement.style.display = events.length ? 'block' : 'none';
            }
            
            apts.forEach(event => {
                const el = document.createElement('div');
                el.className = 'list-item apt p-3 rounded flex justify-between items-center shadow-md';
                let dateLabel = (!isSpecificDate && event.date) ? `<div class="text-xs text-cyan-500 orbitron mb-1">${monthNames[parseInt(event.date.split('-')[1])-1]} ${event.date.split('-')[2]}</div>` : '';
                let deleteBtn = isSpecificDate ? `<button onclick="deleteEvent(${event.id})" class="text-gray-500 hover:text-red-500 transition-colors px-2">✕</button>` : '';

                el.innerHTML = `
                    <div class="flex flex-col">${dateLabel}<span class="text-white text-lg tracking-wide">${event.text}</span></div>${deleteBtn}
                `;
                aptList.appendChild(el);
            });
            
            todos.forEach(event => {
                const el = document.createElement('div');
                el.className = `list-item todo p-3 rounded flex justify-between items-center shadow-md todo-item ${event.done ? 'done' : ''}`;
                let dateLabel = (!isSpecificDate && event.date) ? `<div class="text-xs text-pink-500 orbitron mb-1">${monthNames[parseInt(event.date.split('-')[1])-1]} ${event.date.split('-')[2]}</div>` : '';
                let interactive = isSpecificDate ? `onchange="toggleTodo(${event.id})"` : 'disabled';
                let deleteBtn = isSpecificDate ? `<button onclick="deleteEvent(${event.id})" class="text-gray-500 hover:text-red-500 transition-colors px-2">✕</button>` : '';

                el.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" class="todo-checkbox" ${event.done ? 'checked' : ''} ${interactive}>
                        <div class="flex flex-col">${dateLabel}<span class="text-white text-lg tracking-wide truncate">${event.text}</span></div>
                    </div>${deleteBtn}
                `;
                todoList.appendChild(el);
            });

            events.forEach(event => {
                const el = document.createElement('div');
                el.className = 'list-item event p-3 rounded flex justify-between items-center shadow-md';
                let dateLabel = (!isSpecificDate && event.date) ? `<div class="text-xs text-green-500 orbitron mb-1">${monthNames[parseInt(event.date.split('-')[1])-1]} ${event.date.split('-')[2]}</div>` : '';
                let deleteBtn = isSpecificDate ? `<button onclick="deleteEvent(${event.id})" class="text-gray-500 hover:text-red-500 transition-colors px-2">✕</button>` : '';

                el.innerHTML = `
                    <div class="flex flex-col">${dateLabel}<span class="text-white text-lg tracking-wide">${event.text}</span></div>${deleteBtn}
                `;
                eventList.appendChild(el);
            });
        }

        function addEvent() {
            const text = eventInput.value.trim();
            const time = document.getElementById('eventTimeInput').value;
            if (!text || !selectedDateStr) return;
            
            if (!eventsData[selectedDateStr]) eventsData[selectedDateStr] = [];
            
            let eventText = time ? `${text} @ ${time}` : text;

            eventsData[selectedDateStr].push({
                id: Date.now(), type: currentEventType, text: eventText, done: false
            });
            
            eventInput.value = '';
            document.getElementById('eventTimeInput').value = '';
            
            saveData(); // <--- TRIGGERS SAVE
            renderEvents();
            renderCalendar(); 
        }

        function handleEnter(e) {
            if (e.key === 'Enter') addEvent();
        }

        function deleteEvent(id) {
            if (!selectedDateStr || !eventsData[selectedDateStr]) return;
            
            eventsData[selectedDateStr] = eventsData[selectedDateStr].filter(e => e.id !== id);
            if (eventsData[selectedDateStr].length === 0) delete eventsData[selectedDateStr];
            
            saveData(); // <--- TRIGGERS SAVE
            renderEvents();
            renderCalendar();
        }

        function toggleTodo(id) {
            if (!selectedDateStr || !eventsData[selectedDateStr]) return;
            
            const event = eventsData[selectedDateStr].find(e => e.id === id);
            if (event) {
                event.done = !event.done;
                saveData(); // <--- TRIGGERS SAVE
                renderEvents();
            }
        }

        function quickAdd(type) {
            const dateVal = document.getElementById('qaDate').value;
            const timeVal = document.getElementById('qaTime').value;
            const textVal = document.getElementById('qaText').value.trim();

            if (!dateVal || !textVal) return;

            let eventText = timeVal ? `${textVal} @ ${timeVal}` : textVal;

            if (!eventsData[dateVal]) eventsData[dateVal] = [];

            eventsData[dateVal].push({
                id: Date.now(), type: type, text: eventText, done: false
            });

            document.getElementById('qaDate').value = '';
            document.getElementById('qaTime').value = '';
            document.getElementById('qaText').value = '';

            saveData(); // <--- TRIGGERS SAVE
            renderEvents();
            renderCalendar();
        }

        window.setShift = function(dateStr, type, event) {
            if (event) event.stopPropagation();
            if (type) shiftsData[dateStr] = type;
            else delete shiftsData[dateStr];
            
            saveData(); // <--- TRIGGERS SAVE
            renderShifts();
        };

        window.toggleOnCall = function(dateStr, event) {
            if (event) event.stopPropagation();
            if (onCallData[dateStr]) delete onCallData[dateStr];
            else onCallData[dateStr] = true;
            
            saveData(); // <--- TRIGGERS SAVE
            renderShifts();
        };

        function changeShiftMonth() {
            const monthSelect = document.getElementById('shiftMonthSelect');
            const yearSelect = document.getElementById('shiftYearSelect');
            if(monthSelect && yearSelect) {
                shiftCurrentDate.setMonth(parseInt(monthSelect.value));
                shiftCurrentDate.setFullYear(parseInt(yearSelect.value));
                renderShifts();
            }
        }

        function renderShifts() {
            const shiftsGrid = document.getElementById('shiftsGrid');
            if(!shiftsGrid) return;
            shiftsGrid.innerHTML = '';
            
            const year = shiftCurrentDate.getFullYear();
            const month = shiftCurrentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const emptyDays = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            
            const monthSelect = document.getElementById('shiftMonthSelect');
            if(monthSelect) monthSelect.value = month;
            
            const yearSelect = document.getElementById('shiftYearSelect');
            if(yearSelect) yearSelect.value = year;

            for (let i = 0; i < emptyDays; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'p-2 rounded bg-transparent border border-transparent';
                shiftsGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const shift = shiftsData[dateStr];
                const isOnCall = onCallData[dateStr];
                
                const shiftEl = document.createElement('div');
                shiftEl.className = 'p-2 rounded bg-black/40 border border-white/5 flex flex-col items-center justify-center transition-all hover:bg-white/10 hover:border-purple-500/50 relative';
                
                const daySpan = document.createElement('span');
                daySpan.className = 'text-[10px] text-gray-500 mb-1 pointer-events-none';
                daySpan.innerText = day;
                shiftEl.appendChild(daySpan);
                
                const shiftSpan = document.createElement('span');
                shiftSpan.className = 'font-bold text-sm md:text-base pointer-events-none';
                
                if (shift === 'LD') { shiftSpan.innerText = 'LD'; shiftSpan.className += ' text-cyan-400 drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]'; }
                else if (shift === 'LTL') { shiftSpan.innerText = 'LTL'; shiftSpan.className += ' text-pink-400 drop-shadow-[0_0_5px_rgba(255,0,255,0.8)]'; }
                else if (shift === 'E') { shiftSpan.innerText = 'E'; shiftSpan.className += ' text-green-400 drop-shadow-[0_0_5px_rgba(57,255,20,0.8)]'; }
                else if (shift === 'L') { shiftSpan.innerText = 'L'; shiftSpan.className += ' text-yellow-400 drop-shadow-[0_0_5px_rgba(255,255,0,0.8)]'; }
                else { shiftSpan.style.display = 'none'; }
                
                shiftEl.appendChild(shiftSpan);
                
                if (isOnCall) {
                    const ocSpan = document.createElement('span');
                    ocSpan.className = 'text-[9px] text-orange-500 font-bold orbitron drop-shadow-[0_0_5px_rgba(255,153,0,0.8)] absolute top-1 right-1 pointer-events-none';
                    ocSpan.innerText = 'OC';
                    shiftEl.appendChild(ocSpan);
                }
                
                const menu = document.createElement('div');
                menu.className = 'hidden absolute top-full left-1/2 -translate-x-1/2 mt-1 z-20 bg-[var(--bg-dark)] border border-purple-500 p-1 rounded flex flex-col gap-1 shadow-[0_0_10px_#bc13fe] shift-menu';
                menu.innerHTML = `
                    <button class="text-cyan-400 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron" onclick="setShift('${dateStr}', 'LD', event)">LD</button>
                    <button class="text-pink-400 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron" onclick="setShift('${dateStr}', 'LTL', event)">LTL</button>
                    <button class="text-green-400 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron" onclick="setShift('${dateStr}', 'E', event)">E</button>
                    <button class="text-yellow-400 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron" onclick="setShift('${dateStr}', 'L', event)">L</button>
                    <button class="text-red-500 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron border-t border-gray-600 mt-1 pt-1" onclick="setShift('${dateStr}', '', event)">Delete Shift</button>
                    <button class="text-orange-500 text-xs hover:bg-white/10 px-2 py-1 rounded orbitron border-t border-gray-600 mt-1 pt-1" onclick="toggleOnCall('${dateStr}', event)">${isOnCall ? '- OC' : '+ OC'}</button>
                `;
                
                const addBtn = document.createElement('button');
                addBtn.className = 'mt-1 text-gray-400 hover:text-white text-[10px] bg-white/5 hover:bg-white/20 rounded-full w-5 h-5 flex items-center justify-center transition-colors';
                addBtn.innerText = (shift || isOnCall) ? '✎' : '+';
                
                addBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.shift-menu').forEach(el => el.classList.add('hidden'));
                    menu.classList.remove('hidden');
                };
                
                shiftEl.appendChild(addBtn);
                shiftEl.appendChild(menu);

                shiftsGrid.appendChild(shiftEl);
            }
        }
        
        document.addEventListener('click', () => {
            document.querySelectorAll('.shift-menu').forEach(el => el.classList.add('hidden'));
        });

        function initSnakeGame() {
            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 30;
            let cols, rows;
            let snake = [];
            let food = {};
            let lastTime = 0;
            const speed = 150;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                cols = Math.floor(canvas.width / gridSize);
                rows = Math.floor(canvas.height / gridSize);
                resetSnake();
            }

            function resetSnake() {
                snake = [{x: Math.floor(cols / 2), y: Math.floor(rows / 2)}];
                for(let i = 1; i < 4; i++) {
                    snake.push({x: snake[0].x, y: snake[0].y + i});
                }
                spawnFood();
            }

            function spawnFood() {
                let valid = false;
                while(!valid) {
                    food = {
                        x: Math.floor(Math.random() * (cols - 2)) + 1,
                        y: Math.floor(Math.random() * (rows - 2)) + 1
                    };
                    valid = !snake.some(s => s.x === food.x && s.y === food.y);
                }
            }

            function getAIMove() {
                const head = snake[0];
                const possibleMoves = [
                    {dx: 1, dy: 0}, {dx: -1, dy: 0},
                    {dx: 0, dy: 1}, {dx: 0, dy: -1}
                ];
                
                let safeMoves = possibleMoves.filter(m => {
                    let nx = head.x + m.dx;
                    let ny = head.y + m.dy;
                    if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return false;
                    for (let i = 0; i < snake.length - 1; i++) {
                        if (snake[i].x === nx && snake[i].y === ny) return false;
                    }
                    return true;
                });

                if (safeMoves.length === 0) {
                    resetSnake();
                    return {dx: 0, dy: 0};
                }

                safeMoves.sort((a, b) => {
                    let distA = Math.abs((head.x + a.dx) - food.x) + Math.abs((head.y + a.dy) - food.y);
                    let distB = Math.abs((head.x + b.dx) - food.x) + Math.abs((head.y + b.dy) - food.y);
                    return distA - distB;
                });

                return safeMoves[0];
            }

            function update(time) {
                requestAnimationFrame(update);
                if (time - lastTime < speed) return;
                lastTime = time;

                let move = getAIMove();
                if (move.dx === 0 && move.dy === 0) return;

                let head = {x: snake[0].x + move.dx, y: snake[0].y + move.dy};
                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    spawnFood();
                } else {
                    snake.pop();
                }

                draw();
            }

            function draw() {
                ctx.fillStyle = '#050508';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff00ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff00ff';
                ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

                ctx.fillStyle = '#00f3ff';
                ctx.shadowColor = '#00f3ff';
                snake.forEach((segment, index) => {
                    ctx.shadowBlur = index === 0 ? 20 : 8;
                    ctx.globalAlpha = Math.max(0.15, 1 - (index / (snake.length + 8)));
                    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(update);
        }

        window.onload = () => {
            init();
            initSnakeGame();
        };
    </script>
</body>
