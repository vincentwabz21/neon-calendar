
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sync - normzFPV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --neon-orange: #ff9900;
        }
        body {
            background-color: var(--bg-dark);
            color: #e0e0ff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }
        h1, h2, h3, .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Background Effects */
        #snakeCanvas { position: fixed; top: 0; left: 0; z-index: -2; opacity: 0.15; }
        .planet {
            position: fixed; border-radius: 50%; z-index: -1; opacity: 0.4; filter: blur(4px);
        }
        .planet-1 { width: 300px; height: 300px; top: -100px; right: -50px; background: radial-gradient(circle, var(--neon-purple), transparent); }
        .planet-2 { width: 150px; height: 150px; bottom: 10vh; left: 5vw; background: radial-gradient(circle, var(--neon-cyan), transparent); }

        /* UI Styling */
        .glass-panel {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(188, 19, 254, 0.3);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.1);
        }
        .glow-text { text-shadow: 0 0 5px currentColor; }
        .btn-neon {
            transition: all 0.2s;
            border: 1px solid;
        }
        .btn-neon:hover { box-shadow: 0 0 10px currentColor inset, 0 0 10px currentColor; }
        
        /* Grid setup */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day {
            aspect-ratio: 1; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: flex-end; padding: 4px;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .cal-day:hover { border-color: var(--neon-cyan); background: rgba(0, 243, 255, 0.05); }
        .cal-day.active { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,255,0.3) inset; }
        
        .event-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }
        .dot-appt { background-color: var(--neon-cyan); box-shadow: 0 0 4px var(--neon-cyan); }
        .dot-todo { background-color: var(--neon-pink); box-shadow: 0 0 4px var(--neon-pink); }
        .dot-event { background-color: var(--neon-green); box-shadow: 0 0 4px var(--neon-green); }

        /* Holiday Badges */
        .badge { font-size: 0.6rem; position: absolute; top: 2px; left: 2px; font-weight: bold; }
        .badge-hol { color: var(--neon-pink); }
        .badge-inset { color: var(--neon-orange); }

        /* Shift Blocks */
        .shift-block {
            padding: 8px 4px; border: 1px solid rgba(255,255,255,0.1); text-align: center;
            font-weight: bold; cursor: pointer; position: relative; font-size: 0.8rem;
        }
        .shift-LD { color: var(--neon-cyan); border-bottom: 2px solid var(--neon-cyan); }
        .shift-LTL { color: var(--neon-purple); border-bottom: 2px solid var(--neon-purple); }
        .shift-E { color: var(--neon-green); border-bottom: 2px solid var(--neon-green); }
        .shift-L { color: var(--neon-pink); border-bottom: 2px solid var(--neon-pink); }
        .badge-oc { color: var(--neon-orange); position: absolute; top: 0; right: 2px; font-size: 0.6rem; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <canvas id="snakeCanvas"></canvas>
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>

    <!-- Header -->
    <header class="p-4 flex justify-between items-center border-b border-purple-900 glass-panel z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-3xl text-purple-400 glow-text italic tracking-wider">normzFPV</h1>
            <span class="text-gray-500 text-sm mt-2">NEON SYNC</span>
        </div>
        <div class="text-right">
            <div id="bible-verse" class="text-sm italic text-gray-400 max-w-md"></div>
            <div class="text-neon-pink glow-text text-xl">✝</div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden z-10">
        
        <!-- Main Left Column -->
        <main class="flex-1 p-6 overflow-y-auto flex flex-col gap-6">
            
            <!-- Calendar Section -->
            <section class="glass-panel p-6 rounded-lg">
                <div class="flex justify-between items-center mb-4">
                    <button id="prevMonth" class="text-cyan-400 hover:text-white px-3 py-1 btn-neon border-cyan-400 rounded">&lt; Prev</button>
                    <h2 id="currentMonthYear" class="text-2xl orbitron text-cyan-400 glow-text"></h2>
                    <button id="nextMonth" class="text-cyan-400 hover:text-white px-3 py-1 btn-neon border-cyan-400 rounded">Next &gt;</button>
                </div>
                
                <div class="cal-grid mb-2 text-center text-gray-400 text-sm">
                    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                </div>
                <div id="calendarGrid" class="cal-grid"></div>
                
                <div class="mt-4 flex gap-4 text-xs text-gray-400 justify-center">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400"></span> Appt</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-pink-500"></span> To-Do</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-400"></span> Event</span>
                    <span class="flex items-center gap-1"><span class="badge-hol relative text-pink-500">HOL</span> Holiday</span>
                    <span class="flex items-center gap-1"><span class="badge-inset relative text-orange-400">INSET</span> Inset Day</span>
                </div>
            </section>

            <!-- Work Shifts Section -->
            <section class="glass-panel p-6 rounded-lg">
                <div class="flex justify-between items-center mb-4 border-b border-purple-900 pb-2">
                    <h3 class="text-xl orbitron text-purple-400 glow-text">WORK SHIFTS</h3>
                    <div class="flex gap-2">
                        <select id="shiftMonth" class="bg-gray-900 border border-purple-500 text-purple-300 rounded p-1 text-sm"></select>
                        <select id="shiftYear" class="bg-gray-900 border border-purple-500 text-purple-300 rounded p-1 text-sm"></select>
                    </div>
                </div>
                
                <div class="cal-grid text-center text-gray-500 text-xs mb-1">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div id="shiftGrid" class="cal-grid mb-4"></div>

                <div class="flex flex-wrap gap-3 text-xs justify-center orbitron">
                    <span class="text-cyan-400">LD: Long Day</span>
                    <span class="text-purple-400">LTL: Late Twilight</span>
                    <span class="text-green-400">E: Early</span>
                    <span class="text-pink-500">L: Late</span>
                    <span class="text-orange-400">OC: On Call</span>
                </div>
            </section>
        </main>

        <!-- Right Side Panel -->
        <aside class="w-96 glass-panel border-l flex flex-col h-full">
            
            <!-- Quick Add Tab -->
            <div class="bg-purple-900/40 p-4 border-b border-purple-500">
                <h3 class="text-purple-300 orbitron mb-3 flex items-center gap-2">
                    <span class="text-lg">⚡</span> QUICK ADD
                </h3>
                <div class="flex flex-col gap-2">
                    <div class="flex gap-2">
                        <input type="date" id="qaDate" class="flex-1 bg-black/50 border border-purple-500 text-white p-2 rounded text-sm">
                        <input type="time" id="qaTime" class="w-24 bg-black/50 border border-purple-500 text-white p-2 rounded text-sm">
                    </div>
                    <input type="text" id="qaTitle" placeholder="Event details..." class="bg-black/50 border border-purple-500 text-white p-2 rounded text-sm">
                    <div class="flex gap-2 mt-1">
                        <button onclick="quickAdd('appt')" class="flex-1 text-cyan-400 border border-cyan-400 rounded py-1 text-sm hover:bg-cyan-900/30">Appt</button>
                        <button onclick="quickAdd('todo')" class="flex-1 text-pink-500 border border-pink-500 rounded py-1 text-sm hover:bg-pink-900/30">To-Do</button>
                        <button onclick="quickAdd('event')" class="flex-1 text-green-400 border border-green-400 rounded py-1 text-sm hover:bg-green-900/30">Event</button>
                    </div>
                </div>
            </div>

            <!-- Panel Content -->
            <div class="p-6 flex-1 overflow-y-auto flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="panelTitle" class="text-2xl orbitron text-white">Upcoming</h2>
                    <button id="closePanelBtn" class="text-gray-500 hover:text-white hidden text-xl">✕</button>
                </div>
                <div id="eventList" class="flex flex-col gap-3 flex-1"></div>
            </div>
        </aside>

        <!-- Shift Picker Modal (Hidden) -->
        <div id="shiftModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
            <div class="glass-panel p-6 rounded-lg border-purple-500 border max-w-xs w-full">
                <h3 class="orbitron text-purple-400 mb-4 text-center">Select Shift</h3>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="setShift('LD')" class="border border-cyan-400 text-cyan-400 py-2 hover:bg-cyan-400/20">LD</button>
                    <button onclick="setShift('LTL')" class="border border-purple-400 text-purple-400 py-2 hover:bg-purple-400/20">LTL</button>
                    <button onclick="setShift('E')" class="border border-green-400 text-green-400 py-2 hover:bg-green-400/20">E</button>
                    <button onclick="setShift('L')" class="border border-pink-500 text-pink-500 py-2 hover:bg-pink-500/20">L</button>
                </div>
                <button onclick="toggleOnCall()" class="w-full border border-orange-400 text-orange-400 py-2 hover:bg-orange-400/20 mb-2">Toggle On Call (OC)</button>
                <button onclick="setShift(null)" class="w-full border border-red-500 text-red-500 py-2 hover:bg-red-500/20 mb-4">Delete Shift</button>
                <button onclick="closeShiftModal()" class="w-full text-gray-400 text-sm underline">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. LOCAL STORAGE SETUP ---
        // This is the fix: Load existing data from the browser, or start fresh if none exists.
        let events = JSON.parse(localStorage.getItem('neonEvents')) || [];
        let shifts = JSON.parse(localStorage.getItem('neonShifts')) || {};

        // Helper function to save data every time a change is made
        function saveState() {
            localStorage.setItem('neonEvents', JSON.stringify(events));
            localStorage.setItem('neonShifts', JSON.stringify(shifts));
        }

        // --- CALENDAR LOGIC ---
        let currentDate = new Date();
        let selectedDate = null;
        let activeShiftDateStr = null;

        // UK Dates (Example Data)
        const ukDates = {
            '2026-11-13': { type: 'inset' },
            '2026-12-25': { type: 'hol' },
            '2026-12-26': { type: 'hol' }
        };

        const bibleVerses = [
            "I can do all things through Christ which strengtheneth me. - Phil 4:13",
            "The Lord is my shepherd; I shall not want. - Psalm 23:1",
            "Be strong and of a good courage, fear not... - Deut 31:6"
        ];
        document.getElementById('bible-verse').innerText = bibleVerses[new Date().getDate() % bibleVerses.length];

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonthYear').innerText = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                if (selectedDate === dateStr) dayDiv.classList.add('active');
                
                dayDiv.innerHTML = `<span class="text-sm font-bold">${i}</span>`;
                
                // Add UK Date Badges
                if (ukDates[dateStr]) {
                    if(ukDates[dateStr].type === 'hol') dayDiv.innerHTML += `<span class="badge badge-hol">HOL</span>`;
                    if(ukDates[dateStr].type === 'inset') dayDiv.innerHTML += `<span class="badge badge-inset">INSET</span>`;
                }

                // Add Event Dots
                const dayEvents = events.filter(e => e.date === dateStr);
                const dotsDiv = document.createElement('div');
                dotsDiv.className = 'flex flex-wrap gap-1 mt-1 justify-end w-full';
                dayEvents.forEach(e => {
                    const dot = document.createElement('div');
                    dot.className = `event-dot dot-${e.type}`;
                    dotsDiv.appendChild(dot);
                });
                dayDiv.appendChild(dotsDiv);
                
                dayDiv.onclick = () => selectDate(dateStr);
                grid.appendChild(dayDiv);
            }
        }

        // --- SHIFT LOGIC ---
        let shiftCurrentDate = new Date();

        function initShiftSelects() {
            const mSel = document.getElementById('shiftMonth');
            const ySel = document.getElementById('shiftYear');
            
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            months.forEach((m, i) => { mSel.innerHTML += `<option value="${i}">${m}</option>`; });
            
            const currentY = new Date().getFullYear();
            for(let i = currentY - 1; i <= currentY + 3; i++) {
                ySel.innerHTML += `<option value="${i}">${i}</option>`;
            }
            
            mSel.value = shiftCurrentDate.getMonth();
            ySel.value = shiftCurrentDate.getFullYear();
            
            mSel.onchange = () => { shiftCurrentDate.setMonth(mSel.value); renderShifts(); };
            ySel.onchange = () => { shiftCurrentDate.setFullYear(ySel.value); renderShifts(); };
        }

        function renderShifts() {
            const grid = document.getElementById('shiftGrid');
            grid.innerHTML = '';
            
            const year = shiftCurrentDate.getFullYear();
            const month = shiftCurrentDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let i = 0; i < firstDay; i++) { grid.appendChild(document.createElement('div')); }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const shiftData = shifts[dateStr] || {};
                
                const div = document.createElement('div');
                div.className = `shift-block ${shiftData.shift ? 'shift-'+shiftData.shift : ''}`;
                div.innerHTML = `
                    <div class="text-[0.6rem] text-gray-500 absolute top-0 left-1">${i}</div>
                    ${shiftData.shift ? shiftData.shift : '<span class="text-gray-700 font-normal">+</span>'}
                    ${shiftData.oc ? '<span class="badge-oc">OC</span>' : ''}
                `;
                div.onclick = () => openShiftModal(dateStr);
                grid.appendChild(div);
            }
        }

        function openShiftModal(dateStr) {
            activeShiftDateStr = dateStr;
            document.getElementById('shiftModal').classList.remove('hidden');
        }
        function closeShiftModal() {
            document.getElementById('shiftModal').classList.add('hidden');
            activeShiftDateStr = null;
        }
        function setShift(shiftCode) {
            if(!shifts[activeShiftDateStr]) shifts[activeShiftDateStr] = {};
            
            if (shiftCode === null) {
                // Delete shift logic
                delete shifts[activeShiftDateStr];
            } else {
                shifts[activeShiftDateStr].shift = shiftCode;
            }
            saveState(); // SAVE TO LOCAL STORAGE
            renderShifts();
            closeShiftModal();
        }
        function toggleOnCall() {
            if(!shifts[activeShiftDateStr]) shifts[activeShiftDateStr] = {};
            shifts[activeShiftDateStr].oc = !shifts[activeShiftDateStr].oc;
            
            if(!shifts[activeShiftDateStr].shift && !shifts[activeShiftDateStr].oc) {
                delete shifts[activeShiftDateStr];
            }
            saveState(); // SAVE TO LOCAL STORAGE
            renderShifts();
            closeShiftModal();
        }

        // --- EVENT PANEL LOGIC ---
        function selectDate(dateStr) {
            selectedDate = dateStr;
            document.getElementById('panelTitle').innerText = dateStr;
            document.getElementById('closePanelBtn').classList.remove('hidden');
            renderCalendar();
            renderEvents();
        }

        document.getElementById('closePanelBtn').onclick = () => {
            selectedDate = null;
            document.getElementById('panelTitle').innerText = 'Upcoming';
            document.getElementById('closePanelBtn').classList.add('hidden');
            renderCalendar();
            renderEvents();
        };

        function renderEvents() {
            const list = document.getElementById('eventList');
            list.innerHTML = '';
            
            let displayEvents = events;
            if (selectedDate) {
                displayEvents = events.filter(e => e.date === selectedDate);
            } else {
                const today = new Date().toISOString().split('T')[0];
                displayEvents = events.filter(e => e.date >= today).sort((a,b) => a.date.localeCompare(b.date));
            }

            if (displayEvents.length === 0) {
                list.innerHTML = `<div class="text-gray-500 text-center italic mt-10">No events found.</div>`;
                return;
            }

            displayEvents.forEach(ev => {
                const el = document.createElement('div');
                const colorClass = ev.type === 'appt' ? 'border-cyan-400' : (ev.type === 'todo' ? 'border-pink-500' : 'border-green-400');
                const titleColor = ev.type === 'appt' ? 'text-cyan-400' : (ev.type === 'todo' ? 'text-pink-500' : 'text-green-400');
                
                el.className = `p-3 border-l-4 ${colorClass} bg-black/40 rounded flex justify-between items-center`;
                
                let content = `<div>`;
                if (!selectedDate) content += `<div class="text-xs text-gray-400 mb-1">${ev.date}</div>`;
                content += `<div class="${titleColor} font-bold flex items-center gap-2">
                    ${ev.type === 'todo' ? `<input type="checkbox" ${ev.completed ? 'checked' : ''} onchange="toggleTodo('${ev.id}')">` : ''}
                    <span class="${ev.completed ? 'line-through text-gray-500' : ''}">${ev.title}</span>
                </div>`;
                if (ev.time) content += `<div class="text-xs text-gray-400 mt-1">🕒 ${ev.time}</div>`;
                content += `</div>`;
                
                content += `<button onclick="deleteEvent('${ev.id}')" class="text-red-500 hover:text-red-400 text-sm">✕</button>`;
                el.innerHTML = content;
                list.appendChild(el);
            });
        }

        function quickAdd(type) {
            const dateStr = document.getElementById('qaDate').value;
            const timeStr = document.getElementById('qaTime').value;
            const title = document.getElementById('qaTitle').value;
            
            if (!dateStr || !title) return alert('Date and Details are required!');
            
            events.push({
                id: Math.random().toString(36).substr(2, 9),
                date: dateStr,
                time: timeStr,
                title: title,
                type: type,
                completed: false
            });
            
            document.getElementById('qaTitle').value = '';
            document.getElementById('qaTime').value = '';
            
            saveState(); // SAVE TO LOCAL STORAGE
            
            if(selectedDate && selectedDate !== dateStr) selectDate(dateStr);
            else { renderCalendar(); renderEvents(); }
        }

        function toggleTodo(id) {
            const ev = events.find(e => e.id === id);
            if (ev) {
                ev.completed = !ev.completed;
                saveState(); // SAVE TO LOCAL STORAGE
                renderEvents();
            }
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveState(); // SAVE TO LOCAL STORAGE
            renderCalendar();
            renderEvents();
        }

        // Background Snake Game Logic
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        // Initializing variables properly
        let cols = 0; 
        let rows = 0;
        const size = 30;
        let snake = [];
        let food = {};
        let d = {x: 1, y: 0};

        function initSnake() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / size);
            rows = Math.floor(canvas.height / size);
            snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
            placeFood();
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows)
            };
        }

        function drawSnake() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw food
            ctx.fillStyle = '#ff00ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff00ff';
            ctx.fillRect(food.x * size, food.y * size, size - 2, size - 2);
            
            // Draw snake
            ctx.fillStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * size, snake[i].y * size, size - 2, size - 2);
            }
            
            // AI Movement logic (move towards food)
            let head = snake[0];
            if (head.x < food.x) d = {x: 1, y: 0};
            else if (head.x > food.x) d = {x: -1, y: 0};
            else if (head.y < food.y) d = {x: 0, y: 1};
            else if (head.y > food.y) d = {x: 0, y: -1};

            let newHead = {x: head.x + d.x, y: head.y + d.y};
            snake.unshift(newHead);
            
            if (newHead.x === food.x && newHead.y === food.y) {
                placeFood();
            } else {
                snake.pop();
            }
            
            setTimeout(drawSnake, 150);
        }

        // Init
        document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
        
        // Auto-set Quick Add date to today
        document.getElementById('qaDate').value = new Date().toISOString().split('T')[0];

        window.addEventListener('resize', initSnake);
        initSnake();
        drawSnake();
        initShiftSelects();
        renderCalendar();
        renderShifts();
        renderEvents();
    </script>
</body>
</html>
