<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sync - Cyberpunk Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --panel-bg: rgba(10, 10, 18, 0.85);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --text-main: #e0e0ff;
        }

        body {
            background-color: transparent;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3, .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }

        /* Neon Glows */
        .glow-text-cyan {
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            color: #fff;
        }
        .glow-text-pink {
            text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            color: #fff;
        }

        .neon-box {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .neon-box:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .neon-box-pink {
            border: 1px solid rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.1), inset 0 0 20px rgba(255, 0, 255, 0.05);
        }

        /* Calendar Grid */
        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10%;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-cell:hover:not(.empty) {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .day-cell.active {
            background: rgba(255, 0, 255, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), inset 0 0 10px var(--neon-pink);
            color: #fff;
            transform: scale(1.05);
            z-index: 10;
        }

        .day-cell.empty {
            cursor: default;
            opacity: 0.3;
            background: transparent;
            border-color: transparent;
        }

        .day-cell .day-number {
            font-size: 1.2rem;
            font-weight: 600;
            pointer-events: none;
        }

        .event-indicator {
            display: flex;
            gap: 4px;
            margin-top: auto;
            margin-bottom: 10%;
            pointer-events: none;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-apt { background: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }
        .dot-todo { background: var(--neon-pink); box-shadow: 0 0 5px var(--neon-pink); }
        .dot-event { background: var(--neon-green); box-shadow: 0 0 5px var(--neon-green); }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-in {
            animation: slideIn 0.4s ease forwards;
        }

        /* Inputs & Buttons */
        .neon-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #fff;
            border-radius: 6px;
            padding: 8px 12px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        .neon-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .neon-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .neon-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Checkbox styling */
        .todo-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--neon-pink);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .todo-checkbox:checked {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .todo-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #000;
